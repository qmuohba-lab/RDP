name: macOS Tailscale VNC Access

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Enable macOS Screen Sharing (VNC)
        run: |
          echo "Enabling remote management..."
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users runner -privs -all -restart -agent -pcm

          echo "Getting Tailscale IP address..."
          tailscale ip -4
          
      - name: Keep Runner Alive
        run: |
          echo "VNC server is running over Tailscale. You can connect using your Tailscale IP."
          sleep 3600
          
